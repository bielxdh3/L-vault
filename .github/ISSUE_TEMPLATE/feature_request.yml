name: Feature request
description: Propose an L-Vault improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What backup, recovery, or usability problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gmail backup
        - Google Takeout / media
        - Viewer / search
        - Authentication / security
        - Integrity / deduplication
        - Restore / replica
        - Disk clone
        - Scheduling / Windows
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: boundary
    attributes:
      label: Data-safety impact
      options:
        - label: This may affect credentials, stored data, destructive operations, recovery, or device access.
