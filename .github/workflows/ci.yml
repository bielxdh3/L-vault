name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-python:
    name: Windows Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

      - name: Confirm clean checkout
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git status --short
            throw "Validation generated repository changes"
          }

  rust-integrity:
    name: Rust integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
        working-directory: native/integrity

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Rust minimum version
        run: |
          rust_version="$(rustc --version | awk '{ print $2 }')"
          IFS=. read -r rust_major rust_minor _ <<< "${rust_version%%-*}"
          if (( rust_major < 1 || (rust_major == 1 && rust_minor < 88) )); then
            echo "Rust 1.88.0 or newer is required; found ${rust_version}" >&2
            exit 1
          fi
          echo "Using Rust ${rust_version} (minimum: 1.88.0)"

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run locked Rust tests
        run: cargo test --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/lvault-integrity-target

      - name: Confirm clean checkout
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi
