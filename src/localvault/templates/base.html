<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LocalVault{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v=ab47d33">
</head>
<body>
  <header>
    <a class="brand" href="/">LocalVault</a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
      <a href="/control" class="{{ 'active' if request.url.path == '/control' else '' }}">Controle</a>
      <a href="/disk-clone" class="{{ 'active' if request.url.path.startswith('/disk-clone') else '' }}">Clone do disco</a>
      <a href="/backups" class="{{ 'active' if request.url.path == '/backups' else '' }}">Backups</a>
      <a href="/gmail" class="{{ 'active' if request.url.path.startswith('/gmail') else '' }}">Gmail</a>
      <a href="/fotos" class="{{ 'active' if request.url.path.startswith('/fotos') else '' }}">Fotos</a>
      <a href="/reports" class="{{ 'active' if request.url.path == '/reports' else '' }}">Relatorios</a>
      <form method="post" action="/logout" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sair</button></form>
    </nav>
  </header>
  <main class="page-enter">{% block content %}{% endblock %}</main>
</body>
</html>
